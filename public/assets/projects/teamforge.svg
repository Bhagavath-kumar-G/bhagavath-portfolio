<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background -->
  <rect width="800" height="500" fill="#171717"/>
  
  <!-- Subtle Sub-grid Lines -->
  <line x1="60" y1="60" x2="740" y2="60" stroke="#383838" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="60" y1="440" x2="740" y2="440" stroke="#383838" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="60" y1="60" x2="60" y2="440" stroke="#383838" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="740" y1="60" x2="740" y2="440" stroke="#383838" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Top Metadata Bar -->
  <rect x="80" y="80" width="640" height="42" fill="#222222" stroke="#383838" stroke-width="1" rx="4"/>
  <text x="100" y="106" fill="#A3A3A3" font-family="Poppins, sans-serif" font-size="11" font-weight="500" letter-spacing="2">TEAM COLLABORATION // MATCHING ENGINE</text>
  <circle cx="695" cy="101" r="4" fill="#C8C4B8"/>
  <text x="645" y="106" fill="#A3A3A3" font-family="Poppins, sans-serif" font-size="10" letter-spacing="1">SYNCHRONIZED</text>

  <!-- Connection Graph Lines -->
  <path d="M 240 220 L 400 180 L 560 220 L 400 320 Z" fill="none" stroke="#383838" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="240" y1="220" x2="400" y2="320" stroke="#383838" stroke-width="1"/>
  <line x1="400" y1="180" x2="560" y2="220" stroke="#383838" stroke-width="1"/>

  <!-- Central Hub Node -->
  <circle cx="400" cy="235" r="32" fill="#222222" stroke="#C8C4B8" stroke-width="1.5"/>
  <text x="400" y="233" text-anchor="middle" fill="#F2F0E9" font-family="Poppins, sans-serif" font-size="10" font-weight="600" letter-spacing="1.5">TEAM</text>
  <text x="400" y="247" text-anchor="middle" fill="#A3A3A3" font-family="Poppins, sans-serif" font-size="9">CORE</text>

  <!-- Member Node 1 (Frontend) -->
  <g transform="translate(190, 180)">
    <rect x="0" y="0" width="100" height="70" fill="#222222" stroke="#383838" stroke-width="1" rx="4"/>
    <circle cx="20" cy="24" r="10" fill="#171717" stroke="#C8C4B8" stroke-width="1"/>
    <text x="36" y="22" fill="#F2F0E9" font-family="Poppins, sans-serif" font-size="11" font-weight="500">Member A</text>
    <text x="36" y="34" fill="#A3A3A3" font-family="Poppins, sans-serif" font-size="9">Frontend Dev</text>
    <rect x="14" y="48" width="72" height="6" fill="#171717" rx="2"/>
    <rect x="14" y="48" width="58" height="6" fill="#C8C4B8" rx="2"/>
  </g>

  <!-- Member Node 2 (AI / Backend) -->
  <g transform="translate(350, 140)">
    <rect x="0" y="0" width="100" height="64" fill="#222222" stroke="#383838" stroke-width="1" rx="4"/>
    <circle cx="20" cy="22" r="10" fill="#171717" stroke="#C8C4B8" stroke-width="1"/>
    <text x="36" y="20" fill="#F2F0E9" font-family="Poppins, sans-serif" font-size="11" font-weight="500">Member B</text>
    <text x="36" y="32" fill="#A3A3A3" font-family="Poppins, sans-serif" font-size="9">AI / Systems</text>
    <rect x="14" y="44" width="72" height="6" fill="#171717" rx="2"/>
    <rect x="14" y="44" width="66" height="6" fill="#C8C4B8" rx="2"/>
  </g>

  <!-- Member Node 3 (Full Stack) -->
  <g transform="translate(510, 180)">
    <rect x="0" y="0" width="100" height="70" fill="#222222" stroke="#383838" stroke-width="1" rx="4"/>
    <circle cx="20" cy="24" r="10" fill="#171717" stroke="#C8C4B8" stroke-width="1"/>
    <text x="36" y="22" fill="#F2F0E9" font-family="Poppins, sans-serif" font-size="11" font-weight="500">Member C</text>
    <text x="36" y="34" fill="#A3A3A3" font-family="Poppins, sans-serif" font-size="9">Full Stack</text>
    <rect x="14" y="48" width="72" height="6" fill="#171717" rx="2"/>
    <rect x="14" y="48" width="60" height="6" fill="#C8C4B8" rx="2"/>
  </g>

  <!-- Member Node 4 (Product / UX) -->
  <g transform="translate(350, 285)">
    <rect x="0" y="0" width="100" height="64" fill="#222222" stroke="#383838" stroke-width="1" rx="4"/>
    <circle cx="20" cy="22" r="10" fill="#171717" stroke="#C8C4B8" stroke-width="1"/>
    <text x="36" y="20" fill="#F2F0E9" font-family="Poppins, sans-serif" font-size="11" font-weight="500">Member D</text>
    <text x="36" y="32" fill="#A3A3A3" font-family="Poppins, sans-serif" font-size="9">Product &amp; UX</text>
    <rect x="14" y="44" width="72" height="6" fill="#171717" rx="2"/>
    <rect x="14" y="44" width="52" height="6" fill="#C8C4B8" rx="2"/>
  </g>

  <!-- Bottom Match Status Card -->
  <rect x="80" y="375" width="640" height="45" fill="#222222" stroke="#383838" stroke-width="1" rx="4"/>
  <text x="100" y="402" fill="#F2F0E9" font-family="Poppins, sans-serif" font-size="12" font-weight="500">SKILL COMPATIBILITY INDEX</text>
  <text x="590" y="402" fill="#C8C4B8" font-family="Poppins, sans-serif" font-size="12" font-weight="600">96.4% MATCH</text>
  <rect x="295" y="394" width="270" height="8" fill="#171717" rx="3"/>
  <rect x="295" y="394" width="258" height="8" fill="#C8C4B8" rx="3"/>
</svg>

