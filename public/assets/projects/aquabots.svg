<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background -->
  <rect width="800" height="500" fill="#171717"/>

  <!-- Top Metadata Bar -->
  <rect x="80" y="80" width="640" height="42" fill="#222222" stroke="#383838" stroke-width="1" rx="4"/>
  <text x="100" y="106" fill="#A3A3A3" font-family="Poppins, sans-serif" font-size="11" font-weight="500" letter-spacing="2">DRAINAGE TELEMETRY // REAL-TIME SENSOR GRID</text>
  <circle cx="695" cy="101" r="4" fill="#C8C4B8"/>
  <text x="635" y="106" fill="#A3A3A3" font-family="Poppins, sans-serif" font-size="10" letter-spacing="1">LIVE DATA</text>

  <!-- Left Map/Canal Network Wireframe -->
  <rect x="80" y="136" width="380" height="225" fill="#222222" stroke="#383838" stroke-width="1" rx="4"/>
  
  <!-- Stylized Drainage Topology Network -->
  <path d="M 110 280 Q 180 260 220 220 T 320 180 T 420 160" fill="none" stroke="#383838" stroke-width="3" stroke-linecap="round"/>
  <path d="M 220 220 Q 250 290 310 320 T 430 330" fill="none" stroke="#383838" stroke-width="2" stroke-linecap="round"/>
  <path d="M 160 170 Q 210 190 260 190" fill="none" stroke="#383838" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Sensor Stations on the canal -->
  <g transform="translate(220, 220)">
    <circle cx="0" cy="0" r="14" fill="#171717" stroke="#C8C4B8" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="5" fill="#C8C4B8"/>
    <text x="18" y="-4" fill="#F2F0E9" font-family="Poppins, sans-serif" font-size="9" font-weight="500">NODE-01</text>
    <text x="18" y="8" fill="#A3A3A3" font-family="Poppins, sans-serif" font-size="8">FLOW: 1.4 m/s</text>
  </g>

  <g transform="translate(320, 180)">
    <circle cx="0" cy="0" r="10" fill="#171717" stroke="#383838" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3.5" fill="#A3A3A3"/>
    <text x="14" y="-2" fill="#F2F0E9" font-family="Poppins, sans-serif" font-size="9" font-weight="500">NODE-02</text>
    <text x="14" y="9" fill="#A3A3A3" font-family="Poppins, sans-serif" font-size="8">SURGE: 0.2 m</text>
  </g>

  <g transform="translate(310, 320)">
    <circle cx="0" cy="0" r="10" fill="#171717" stroke="#383838" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3.5" fill="#A3A3A3"/>
    <text x="14" y="-2" fill="#F2F0E9" font-family="Poppins, sans-serif" font-size="9" font-weight="500">NODE-03</text>
    <text x="14" y="9" fill="#A3A3A3" font-family="Poppins, sans-serif" font-size="8">NORMAL</text>
  </g>

  <!-- Coordinates Annotation -->
  <text x="100" y="345" fill="#A3A3A3" font-family="Poppins, sans-serif" font-size="9" letter-spacing="1">COORD: 12.9622° N, 80.0544° E // PANCHAYAT SECTOR 04</text>

  <!-- Right Telemetry Panel -->
  <rect x="475" y="136" width="245" height="225" fill="#222222" stroke="#383838" stroke-width="1" rx="4"/>
  <text x="495" y="162" fill="#F2F0E9" font-family="Poppins, sans-serif" font-size="11" font-weight="600" letter-spacing="1">SURGE TELEMETRY</text>

  <!-- Waveform Graph -->
  <g transform="translate(495, 180)">
    <line x1="0" y1="0" x2="205" y2="0" stroke="#383838" stroke-width="0.5"/>
    <line x1="0" y1="35" x2="205" y2="35" stroke="#383838" stroke-width="0.5"/>
    <line x1="0" y1="70" x2="205" y2="70" stroke="#383838" stroke-width="0.5"/>
    <path d="M 0 50 Q 30 20 60 45 T 120 30 T 170 55 T 205 25" fill="none" stroke="#C8C4B8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="205" cy="25" r="3" fill="#F2F0E9"/>
  </g>

  <!-- Metric Readouts -->
  <g transform="translate(495, 275)">
    <text x="0" y="0" fill="#A3A3A3" font-family="Poppins, sans-serif" font-size="9">WATER LEVEL</text>
    <text x="0" y="18" fill="#F2F0E9" font-family="Poppins, sans-serif" font-size="14" font-weight="600">42.8 cm</text>
    <text x="110" y="0" fill="#A3A3A3" font-family="Poppins, sans-serif" font-size="9">DISCHARGE RATE</text>
    <text x="110" y="18" fill="#F2F0E9" font-family="Poppins, sans-serif" font-size="14" font-weight="600">1.24 kL/s</text>
    <text x="0" y="44" fill="#A3A3A3" font-family="Poppins, sans-serif" font-size="9">FLOOD RISK INDEX: LOW (NOMINAL)</text>
  </g>

  <!-- Bottom Analytics Bar -->
  <rect x="80" y="375" width="640" height="45" fill="#222222" stroke="#383838" stroke-width="1" rx="4"/>
  <text x="100" y="402" fill="#F2F0E9" font-family="Poppins, sans-serif" font-size="12" font-weight="500">AUTONOMOUS DISPATCH STATUS</text>
  <text x="590" y="402" fill="#C8C4B8" font-family="Poppins, sans-serif" font-size="12" font-weight="600">ALL CLEAR</text>
  <rect x="330" y="394" width="230" height="8" fill="#171717" rx="3"/>
  <rect x="330" y="394" width="215" height="8" fill="#C8C4B8" rx="3"/>
</svg>

